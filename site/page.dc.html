<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Static fallback for non-JS agents; Metadata.dc.html overwrites both from
     SITE_CONFIG once the page mounts, since this <head> isn't templated. -->
<title>Vertex Order</title>
<meta name="description" content="Recommended ways to experience your favorite game, movie, and book franchises, series by series.">
<script src="./support.js"></script>
<script>
  /* components.js is a generated bundle that inlines every sibling *.dc.html so
     <dc-import> resolves without fetch(), which browsers block on file:// only.
     Over http(s) (GitHub Pages, `just serve`, Claude Design) the runtime fetches
     each *.dc.html live, so load the bundle solely off disk. */
  if (location.protocol === 'file:') {
    document.write('<script src="./components.js"><\/script>');
  }
</script>
</head>

<script type="text/x-dc" data-dc-script>
function mapFranchise(f) {
  const byLabel = f.by ? ('by ' + f.by + (f.firstPublished ? ' \u00b7 ' + f.firstPublished : '')) : null;
  return { title: f.title, href: f.href, byLabel };
}

function splitLive(list) {
  const mapped = list.map(mapFranchise);
  return {
    live: mapped.filter(f => f.href),
    ideas: mapped.filter(f => !f.href),
  };
}

class Component extends DCLogic {
  renderVals() {
    const SITE = window.SITE_CONFIG || {};
    const games = splitLive(window.GAME_FRANCHISES || []);
    const movies = splitLive(window.MOVIE_FRANCHISES || []);
    const books = splitLive(window.BOOK_FRANCHISES || []);
    return {
      metaTitle: SITE.title || 'Vertex Order',
      metaDescription: SITE.description || '',
      gamesLive: games.live,
      gamesHasLive: games.live.length > 0,
      moviesLive: movies.live,
      moviesHasLive: movies.live.length > 0,
      booksLive: books.live,
      booksHasLive: books.live.length > 0,
      gamesIdeas: games.ideas,
      gamesHasIdeas: games.ideas.length > 0,
      moviesIdeas: movies.ideas,
      moviesHasIdeas: movies.ideas.length > 0,
      booksIdeas: books.ideas,
      booksHasIdeas: books.ideas.length > 0,
      helpWantedVisible: games.ideas.length > 0 || movies.ideas.length > 0 || books.ideas.length > 0,
      faqItems: window.FAQ_ITEMS || [],
      footerLicense: [{ text: 'This page is ' }, { text: 'MIT', url: 'https://github.com/vertex-order/home/blob/main/LICENSE' }, { text: ' licensed.' }],
      footerNoticeUrl: 'https://github.com/vertex-order/home/blob/main/NOTICE.md',
    };
  }
}

</script>
