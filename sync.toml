# sync.toml — cross-repo file sync. Read by scripts/sync.py (`just sync`).
# See AGENTS.md → "Cross-repo sync" and CONTRIBUTING.md.
#
# [subscribe.*] — what THIS repo vendors FROM elsewhere. sync.py fetches these
#                 at `ref` and writes them into the tree. Vendored copies —
#                 never hand-edit them here; edit them in the owning repo (kit).
#                 check-vendored.yml fails the PR if any has drifted.
#
# This repo publishes nothing — it owns no file another repo vendors. It's
# the org landing page: a plain link list (site/data/{games,movies,books}.js)
# plus an FAQ, so it only needs a slice of kit's build substrate — no
# platform icons, no series/media components, no floating nav.
#
# Not vendored, even though this repo needs its own: .github/ISSUE_TEMPLATE/*
# and .github/PULL_REQUEST_TEMPLATE.md. Each necessarily carries this repo's
# own Discussions URL (and PR-checklist lines), so a byte-identical vendor is
# impossible by construction. Seeded from kit's copies once, then maintained
# locally.

[subscribe.kit]
repo = "vertex-order/kit"
ref = "1d10b385f1e2386c9ad2318f1d1d549c86f1d290"
paths = [
  "docs/cache.md",
  "docs/tooling.md",
  ".prettierignore",
  "uv.toml",
  "pyproject.toml",
  "uv.lock",
  "schemas/faq.schema.json",
  "schemas/common.schema.json",
  "site/_ds/",
  "site/images/ui/",
  "site/support.js",
  "site/theme-dev.js",
  "site/BackToTop.dc.html",
  "site/FAQ.dc.html",
  "site/Footer.dc.html",
  "site/Metadata.dc.html",
  "site/ThemeToggle.dc.html",
  "scripts/bundle-components.py",
  "scripts/ssr-render.js",
  "scripts/ssr-lib.js",
  "scripts/sync.py",
  "scripts/js_literal.py",
  "scripts/validate-data.py",
  "scripts/check-dedup-drift.py",
  "scripts/normalize-svg.py",
  "scripts/restore-headers.py",
  "scripts/ensure-helmets.py",
  "scripts/strip-c2pa.py",
  "scripts/trim-svg.py",
  "svgo.config.mjs",
  ".stylelintrc.cjs",
  "justfile",
  "package.json",
  "package-lock.json",
  ".npmrc",
  ".node-version",
  ".gitignore",
  ".editorconfig",
  ".gitattributes",
  ".vscode/extensions.json",
  ".claude/settings.json",
  "CODE_OF_CONDUCT.md",
  ".githooks/pre-commit",
  ".github/workflows/fix-build.yml",
  ".github/workflows/autofix.yml",
  ".github/workflows/autofix-apply.yml",
  ".github/workflows/check-generated.yml",
  ".github/workflows/dependabot-automerge.yml",
  ".github/workflows/check-vendored.yml",
  ".github/workflows/check-data.yml",
  ".github/workflows/check-ruff.yml",
  ".github/workflows/check-format.yml",
  ".github/workflows/check-oxlint.yml",
  ".github/workflows/check-actions.yml",
  ".github/workflows/check-toml.yml",
  ".github/workflows/check-schemas.yml",
  ".github/workflows/check-dedup-drift.yml",
  ".github/workflows/check-css.yml",
  ".github/workflows/check-syntax.yml",
  ".github/workflows/sync-repin.yml",
  ".github/workflows/static.yml",
]
# .github/dependabot.yml deliberately not vendored/present -- everything it
# would watch here (package.json, .github/workflows/*.yml) is a vendored
# copy from kit, not owned here; see kit's dependabot.yml header comment.
